# Push a tag like v0.1.0 to publish to PyPI. Uses PyPI trusted publishing: no token
# to store. One-time setup on pypi.org: add a "pending publisher" for project
# "pramaan", owner VividhDesign, repository pramaan, workflow release.yml,
# environment pypi.
name: Release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
