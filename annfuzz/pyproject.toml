[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "annfuzz"
version = "0.1.0"
description = "Property-based correctness tests for approximate-nearest-neighbour libraries"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
all = ["hnswlib", "faiss-cpu", "voyager", "annoy", "pynndescent", "usearch<3"]

[project.scripts]
annfuzz = "annfuzz.__main__:main"
